services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - ids-network

  coordinator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.coordinator
    environment:
      - REDIS_ADDR=redis:6379
    ports:
      - "50051:50051"
      - "9090:9090"
    depends_on:
      - redis
    networks:
      - ids-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9095:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - ids-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ids-network
      
networks:
  ids-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data: