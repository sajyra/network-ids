syntax = "proto3";

option go_package = "github.com/sanjay-rajjan/network-ids/proto/ids";
package ids;

message ThreatEvent {
    string source_ip = 1;
    string type = 2;
    int64 timestamp = 3;
    string node_id = 4;
}

message BlockCommand {
    string source_ip = 1;
    int64 issued_at = 2;
}

service IDSService {
    rpc ReportThreat(stream ThreatEvent) returns (stream BlockCommand);
}

